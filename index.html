<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квиз: Распознай фишинг</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    line-height: 1.6;
    padding: 20px;
  }
  .container {
    max-width: 760px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8a 100%);
    color: #fff;
    padding: 28px 36px;
  }
  header h1 { font-size: 24px; margin-bottom: 6px; }
  header p { font-size: 14px; opacity: 0.9; }
  .content { padding: 28px 36px; }

  .progress {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    font-size: 14px;
    color: #555;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: #e0e7ef;
    border-radius: 4px;
    margin-left: 16px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: #2d5a8a;
    border-radius: 4px;
    transition: width 0.3s ease;
  }

  /* === Карточка письма === */
  .email-card {
    background: #fafbfc;
    border: 1px solid #e0e7ef;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .email-header {
    background: #eef2f7;
    padding: 14px 20px;
    border-bottom: 1px solid #e0e7ef;
    font-size: 13px;
  }
  .email-header .row {
    display: flex;
    margin-bottom: 4px;
  }
  .email-header .row:last-child { margin-bottom: 0; }
  .email-header .label {
    width: 90px;
    color: #6b7a8d;
    flex-shrink: 0;
  }
  .email-header .value {
    color: #1a1a2e;
    font-weight: 500;
    word-break: break-all;
  }
  .email-header .value.suspicious { color: #c62828; font-weight: 600; }
  .email-subject {
    padding: 16px 20px 8px;
    font-weight: 700;
    font-size: 16px;
    color: #1e3a5f;
  }
  .email-body {
    padding: 0 20px 18px;
    font-size: 14px;
    color: #333;
    white-space: pre-line;
  }
  .email-body .cta {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 18px;
    background: #2d5a8a;
    color: #fff;
    border-radius: 6px;
    font-weight: 600;
    font-size: 13px;
    text-decoration: none;
  }

  /* === Кнопки ответа === */
  .answer-buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .answer-buttons button {
    flex: 1;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    border: 2px solid #dde3ea;
    border-radius: 8px;
    background: #fff;
    color: #1a1a2e;
    cursor: pointer;
    transition: all 0.15s;
  }
  .answer-buttons button:hover { border-color: #2d5a8a; background: #f0f5fb; }
  .answer-buttons button.safe:hover { border-color: #2e7d32; background: #e8f5e9; }
  .answer-buttons button.phish:hover { border-color: #c62828; background: #fdecea; }
  .answer-buttons button:disabled { cursor: default; opacity: 0.7; }
  .answer-buttons button.correct { background: #e8f5e9; border-color: #2e7d32; color: #1b5e20; opacity: 1; }
  .answer-buttons button.wrong { background: #fdecea; border-color: #c62828; color: #b71c1c; opacity: 1; }

  /* === Обратная связь === */
  .feedback {
    display: none;
    padding: 16px 20px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #e8f5e9; border-left: 4px solid #2e7d32; color: #1b5e20; }
  .feedback.wrong { background: #fdecea; border-left: 4px solid #c62828; color: #b71c1c; }
  .feedback strong { display: block; margin-bottom: 6px; }
  .feedback .tag {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 10px;
    background: rgba(0,0,0,0.06);
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }

  /* === Навигация === */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }
  .nav button {
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .nav .next {
    background: #2d5a8a;
    color: #fff;
  }
  .nav .next:hover { background: #1e3a5f; }
  .nav .next:disabled { background: #a0b4c8; cursor: not-allowed; }
  .nav .restart {
    background: #fff;
    color: #2d5a8a;
    border: 2px solid #2d5a8a;
  }
  .nav .restart:hover { background: #eef4fb; }

  /* === Финал === */
  .final {
    display: none;
    text-align: center;
    padding: 20px 0;
  }
  .final.show { display: block; }
  .final .score {
    font-size: 48px;
    font-weight: 800;
    color: #2d5a8a;
    margin-bottom: 8px;
  }
  .final .score-label {
    font-size: 16px;
    color: #555;
    margin-bottom: 20px;
  }
  .final .verdict {
    font-size: 16px;
    font-weight: 600;
    padding: 16px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .final .verdict.good { background: #e8f5e9; color: #1b5e20; }
  .final .verdict.mid { background: #fff8e6; color: #7a4a00; }
  .final .verdict.bad { background: #fdecea; color: #b71c1c; }

  .footer {
    background: #1e3a5f;
    color: #fff;
    text-align: center;
    padding: 16px;
    font-size: 13px;
    opacity: 0.95;
  }

  @media (max-width: 600px) {
    header, .content { padding: 20px; }
    .answer-buttons { flex-direction: column; }
    .email-header .row { flex-direction: column; }
    .email-header .label { width: auto; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎣 Распознай фишинг</h1>
    <p>Перед вами 6 писем. Решите: это безопасное письмо или фишинг?</p>
  </header>

  <div class="content">
    <div class="progress">
      <span id="progressText">Письмо 1 из 6</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- Карточка письма (наполняется из JS) -->
    <div class="email-card" id="emailCard">
      <div class="email-header" id="emailHeader"></div>
      <div class="email-subject" id="emailSubject"></div>
      <div class="email-body" id="emailBody"></div>
    </div>

    <!-- Кнопки ответа -->
    <div class="answer-buttons" id="answerButtons">
      <button class="safe" onclick="answer(false)" id="btnSafe">✅ Безопасно</button>
      <button class="phish" onclick="answer(true)" id="btnPhish">🎣 Фишинг</button>
    </div>

    <!-- Обратная связь -->
    <div class="feedback" id="feedback"></div>

    <!-- Навигация -->
    <div class="nav" id="nav" style="display:none;">
      <span></span>
      <button class="next" id="nextBtn" onclick="nextEmail()">Следующее письмо →</button>
    </div>

    <!-- Финальный экран -->
    <div class="final" id="final">
      <div class="score" id="finalScore">0/6</div>
      <div class="score-label">правильных ответов</div>
      <div class="verdict" id="finalVerdict"></div>
      <button class="restart" onclick="restart()">Пройти заново</button>
    </div>
  </div>

  <div class="footer">
    Учебный материал по безопасности · Security Awareness
  </div>
</div>

<script>
  // === Данные: 6 писем (3 фишинг, 3 безопасных) ===
  const emails = [
    {
      from: "it-support@gazprom-security.ru",
      to: "ivanov@company.ru",
      subject: "СРОЧНО: Ваш корпоративный доступ будет заблокирован",
      body: "Уважаемый пользователь!\n\nМы зафиксировали подозрительную активность в вашем аккаунте. Для сохранения доступа необходимо подтвердить учётные данные в течение 2 часов.\n\nДля подтверждения перейдите по ссылке и введите логин и пароль.",
      cta: "Подтвердить доступ",
      isPhishing: true,
      suspiciousField: "from",
      explanation: "Это фишинг. Признаки: (1) адрес отправителя <em>gazprom-security.ru</em> не совпадает с официальным доменом компании; (2) срочность — «в течение 2 часов»; (3) просьба ввести логин и пароль в письме. Легитимные сервисы не запрашивают пароль в письмах.",
      tag: "Фишинг: поддельный домен + срочность + запрос пароля"
    },
    {
      from: "hr@gazprom.ru",
      to: "all-employees@company.ru",
      subject: "Напоминание: обучение по охране труда до 30 ноября",
      body: "Коллеги, добрый день!\n\nНапоминаем, что до 30 ноября необходимо пройти ежегодное обучение по охране труда. Ссылка на курс доступна в разделе «Обучение» на внутреннем портале.\n\nС уважением,\nОтдел кадров",
      cta: null,
      isPhishing: false,
      suspiciousField: null,
      explanation: "Это безопасное письмо. Признаки: (1) официальный домен <em>gazprom.ru</em>; (2) нет срочности и угроз; (3) нет просьбы ввести конфиденциальные данные — ссылка ведёт на внутренний портал, а не на сторонний ресурс; (4) персонализированное обращение к группе сотрудников.",
      tag: "Безопасно: официальный домен, нет запроса данных"
    },
    {
      from: "security@gazporm.ru",
      to: "petrov@company.ru",
      subject: "Ваш пароль истекает сегодня",
      body: "Здравствуйте!\n\nСрок действия вашего пароля истекает сегодня. Чтобы избежать блокировки, немедленно перейдите по ссылке и установите новый пароль.\n\nСлужба безопасности",
      cta: "Сменить пароль",
      isPhishing: true,
      suspiciousField: "from",
      explanation: "Это фишинг. Признаки: (1) домен <em>gazporm.ru</em> — опечатка в названии компании (пропущена буква «о»); (2) срочность — «истекает сегодня»; (3) просьба перейти по ссылке и ввести данные. Обратите внимание на опечатку — это классический приём тайпсквоттинга.",
      tag: "Фишинг: домен с опечаткой (тайпсквоттинг)"
    },
    {
      from: "news@company.ru",
      to: "all@company.ru",
      subject: "Дайджест новостей компании — ноябрь",
      body: "Коллеги!\n\nВ ноябрьском дайджесте: итоги квартала, новые сотрудники, предстоящие мероприятия и фотоотчёт с осеннего тимбилдинга.\n\nЧитайте подробности во внутренней рассылке на портале.\n\nРедакция корпоративной газеты",
      cta: null,
      isPhishing: false,
      suspiciousField: null,
      explanation: "Это безопасное письмо. Признаки: (1) официальный домен <em>company.ru</em>; (2) нет срочности, угроз и запроса конфиденциальных данных; (3) информационный характер — дайджест новостей; (4) нет подозрительных ссылок и вложений.",
      tag: "Безопасно: информационное письмо, нет запроса данных"
    },
    {
      from: "director@company.ru",
      to: "sidorov@company.ru",
      subject: "Срочно: нужно перевести деньги",
      body: "Привет!\n\nЯ на встрече, не могу говорить. Нужно срочно перевести 50 000 рублей на счёт для оплаты договора. Реквизиты ниже. Сделай сегодня, пожалуйста, и никому не говори — это конфиденциально.\n\nОтправь подтверждение, как переведёшь.",
      cta: "Реквизиты",
      isPhishing: true,
      suspiciousField: null,
      explanation: "Это фишинг (BEC — Business Email Compromise). Признаки: (1) срочность и секретность — «никому не говори»; (2) просьба перевести деньги; (3) отправитель представляется руководителем, но адрес может быть поддельным — проверьте точный адрес; (4) давление авторитетом. Всегда проверяйте такие просьбы по телефону или лично.",
      tag: "Фишинг: BEC — просьба перевести деньги «от руководителя»"
    },
    {
      from: "support@company.ru",
      to: "kuznetsov@company.ru",
      subject: "Ваш тикет #4521 закрыт",
      body: "Здравствуйте!\n\nВаш запрос в службу поддержки #4521 был закрыт. Если проблема не решена, вы можете создать новый тикет в личном кабинете.\n\nС уважением,\nСлужба поддержки",
      cta: null,
      isPhishing: false,
      suspiciousField: null,
      explanation: "Это безопасное письмо. Признаки: (1) официальный домен <em>company.ru</em>; (2) нет срочности и угроз; (3) нет просьбы ввести данные — только информационное уведомление; (4) ссылка ведёт на личный кабинет, а не на сторонний ресурс.",
      tag: "Безопасно: уведомление, нет запроса данных"
    }
  ];

  let currentIndex = 0;
  let answers = []; // true = правильно, false = неправильно
  let answered = false;

  // === Рендер текущего письма ===
  function renderEmail() {
    answered = false;
    const email = emails[currentIndex];

    document.getElementById('progressText').textContent =
      `Письмо ${currentIndex + 1} из ${emails.length}`;
    document.getElementById('progressFill').style.width =
      `${((currentIndex) / emails.length) * 100}%`;

    // Шапка
    const header = document.getElementById('emailHeader');
    header.innerHTML = `
      <div class="row">
        <span class="label">От:</span>
        <span class="value ${email.suspiciousField === 'from' ? 'suspicious' : ''}">${email.from}</span>
      </div>
      <div class="row">
        <span class="label">Кому:</span>
        <span class="value">${email.to}</span>
      </div>
    `;

    // Тема
    document.getElementById('emailSubject').textContent = email.subject;

    // Тело
    const body = document.getElementById('emailBody');
    body.innerHTML = email.body.replace(/\n/g, '<br>') +
      (email.cta ? `<br><span class="cta">${email.cta}</span>` : '');

    // Сброс кнопок
    const btnSafe = document.getElementById('btnSafe');
    const btnPhish = document.getElementById('btnPhish');
    btnSafe.className = 'safe';
    btnPhish.className = 'phish';
    btnSafe.disabled = false;
    btnPhish.disabled = false;
    btnSafe.textContent = '✅ Безопасно';
    btnPhish.textContent = '🎣 Фишинг';

    // Сброс обратной связи и навигации
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('nav').style.display = 'none';
  }

  // === Ответ пользователя ===
  function answer(userSaidPhishing) {
    if (answered) return;
    answered = true;

    const email = emails[currentIndex];
    const isCorrect = userSaidPhishing === email.isPhishing;
    answers[currentIndex] = isCorrect;

    const btnSafe = document.getElementById('btnSafe');
    const btnPhish = document.getElementById('btnPhish');
    btnSafe.disabled = true;
    btnPhish.disabled = true;

    // Подсветка кнопок
    if (email.isPhishing) {
      btnPhish.classList.add('correct');
      if (!userSaidPhishing) btnSafe.classList.add('wrong');
    } else {
      btnSafe.classList.add('correct');
      if (userSaidPhishing) btnPhish.classList.add('wrong');
    }

    // Обратная связь
    const feedback = document.getElementById('feedback');
    feedback.className = `feedback show ${isCorrect ? 'correct' : 'wrong'}`;
    feedback.innerHTML = `
      <strong>${isCorrect ? '✅ Верно!' : '❌ Неверно.'}</strong>
      ${email.explanation}
      <div class="tag">${email.tag}</div>
    `;

    // Навигация
    const nav = document.getElementById('nav');
    nav.style.display = 'flex';
    const nextBtn = document.getElementById('nextBtn');
    if (currentIndex === emails.length - 1) {
      nextBtn.textContent = 'Показать результат →';
    } else {
      nextBtn.textContent = 'Следующее письмо →';
    }

    // Обновление прогресса
    document.getElementById('progressFill').style.width =
      `${((currentIndex + 1) / emails.length) * 100}%`;
  }

  // === Переход к следующему письму или финалу ===
  function nextEmail() {
    if (currentIndex < emails.length - 1) {
      currentIndex++;
      renderEmail();
    } else {
      showFinal();
    }
  }

  // === Финальный экран ===
  function showFinal() {
    document.getElementById('emailCard').style.display = 'none';
    document.getElementById('answerButtons').style.display = 'none';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('nav').style.display = 'none';
    document.getElementById('progressText').textContent = 'Результат';
    document.getElementById('progressFill').style.width = '100%';

    const final = document.getElementById('final');
    final.classList.add('show');

    const correctCount = answers.filter(a => a).length;
    document.getElementById('finalScore').textContent =
      `${correctCount}/${emails.length}`;

    const verdict = document.getElementById('finalVerdict');
    verdict.className = 'verdict';
    if (correctCount === emails.length) {
      verdict.classList.add('good');
      verdict.textContent = '🏆 Отлично! Вы уверенно распознаёте фишинг.';
    } else if (correctCount >= emails.length - 2) {
      verdict.classList.add('mid');
      verdict.textContent = `⚠️ Неплохо: ${correctCount} из ${emails.length}. Пересмотрите объяснения — пара моментов требует внимания.`;
    } else {
      verdict.classList.add('bad');
      verdict.textContent = `❌ ${correctCount} из ${emails.length}. Стоит внимательно перечитать памятку — фишинг опасен именно своей незаметностью.`;
    }
  }

  // === Перезапуск ===
  function restart() {
    currentIndex = 0;
    answers = [];
    document.getElementById('final').classList.remove('show');
    document.getElementById('emailCard').style.display = 'block';
    document.getElementById('answerButtons').style.display = 'flex';
    renderEmail();
  }

  // === Инициализация ===
  renderEmail();
</script>
</body>
</html>
